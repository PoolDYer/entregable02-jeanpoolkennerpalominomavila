<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2670" viewBox="0 0 3000 2670" role="img"><title>patron-facade · SIFITUR Huamanga</title><desc>Continua: coordinación / orden · Cada colaborador conserva su contrato · La comprobación de aplicación se complementa con unicidad en PostgreSQL</desc><rect width="100%" height="100%" fill="white"/><rect x="18" y="18" width="2964" height="2634" rx="0" fill="white" stroke="#a6b3bf" stroke-width="2"/><text x="65" y="62.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#447a9e">SIFITUR HUAMANGA  /  ARQUITECTURA Y DISEÑO</text><text x="65" y="116.52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18344e">Facade de aplicación · sincronización de inspecciones</text><text x="65" y="156.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">RegistrarInspeccionCasoUso ofrece una entrada y coordina responsabilidades separadas</text><polyline points="65,183 2935,183" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><rect x="70" y="270" width="950" height="300" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="70" y="270" width="950" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="88" y="294.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">CLIENTE DE LA FACHADA</text><text x="88" y="328.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">InspectionController</text><text x="88" y="385.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ registrar(dto, actor): RespuestaHTTP</text><text x="88" y="413.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Valida entrada REST y obtiene actor</text><text x="88" y="441.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Traduce resultado / error del caso de uso</text><text x="88" y="469.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Sin SQL, generación PDF ni SDK</text><rect x="1510" y="270" width="1420" height="300" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="1510" y="270" width="1420" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="1528" y="294.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">FACHADA / CASO DE USO</text><text x="1528" y="328.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RegistrarInspeccionCasoUso</text><text x="1528" y="385.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ ejecutar(comando, actor): Registro</text><text x="1528" y="413.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Coordina acceso, idempotencia, invariantes y custodia</text><text x="1528" y="441.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Recibe contratos por constructor; conserva errores tipados</text><text x="1528" y="469.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">No delega a una fachada adicional</text><polyline points="1020,420.0 1265.0,420.0 1510,420.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1495.5928463623572,426.9594485457797 1510,420.0 1495.5928463623572,413.0405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1135.0" y="390" width="270.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1145.0" y="410.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Una operación de aplicación</text><polyline points="55,820 2945,820 2945,2010 55,2010 55,820" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="853.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">COLABORADORES · ORDEN DEL FLUJO Y ALTERNATIVAS</text><rect x="100" y="940" width="850" height="245" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="100" y="940" width="850" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="118" y="964.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 1</text><text x="118" y="998.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">OperativoService</text><text x="118" y="1055.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Validar rol, asignación y versionRuta</text><text x="118" y="1083.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Rechazo: 403 / 409</text><rect x="1080" y="940" width="850" height="245" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="1080" y="940" width="850" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="1098" y="964.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 2</text><text x="1098" y="998.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RepositorioInspecciones</text><text x="1098" y="1055.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">buscarOperacion(clave)</text><text x="1098" y="1083.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Existente: compara huella → 200 / 409</text><rect x="2060" y="940" width="850" height="245" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="2060" y="940" width="850" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="2078" y="964.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 3</text><text x="2078" y="998.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Inspeccion.crear</text><text x="2078" y="1055.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Validar ficha, evidencia y firma</text><text x="2078" y="1083.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Error de dominio → 422</text><rect x="100" y="1520" width="850" height="245" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="100" y="1520" width="850" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="118" y="1544.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 4</text><text x="118" y="1578.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">AlmacenEvidencias</text><text x="118" y="1635.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">verificar(objetoId, hash)</text><text x="118" y="1663.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Ausencia / alteración → 422</text><rect x="1080" y="1520" width="850" height="245" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="1080" y="1520" width="850" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="1098" y="1544.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 5</text><text x="1098" y="1578.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RepositorioInspecciones</text><text x="1098" y="1635.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">registrarAtomico(inspeccion, huella)</text><text x="1098" y="1663.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">T1: datos + auditoría + outbox</text><rect x="2060" y="1520" width="850" height="245" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="2060" y="1520" width="850" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="2078" y="1544.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ETAPA 6</text><text x="2078" y="1578.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Registro recibido</text><text x="2078" y="1635.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">inspeccionId + RECIBIDA + versión</text><text x="2078" y="1663.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">201 nuevo / 200 repetición idéntica</text><polyline points="950,1062.5 1015.0,1062.5 1080,1062.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1065.5928463623572,1069.4594485457797 1080,1062.5 1065.5928463623572,1055.5405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="960.5" y="1250" width="99.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="970.5" y="1270.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Continúa</text><polyline points="1930,1062.5 1995.0,1062.5 2060,1062.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="2045.5928463623572,1069.4594485457797 2060,1062.5 2045.5928463623572,1055.5405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1940.5" y="1250" width="99.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1950.5" y="1270.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Continúa</text><polyline points="950,1642.5 1015.0,1642.5 1080,1642.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1065.5928463623572,1649.4594485457797 1080,1642.5 1065.5928463623572,1635.5405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="960.5" y="1830" width="99.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="970.5" y="1850.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Continúa</text><polyline points="1930,1642.5 1995.0,1642.5 2060,1642.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="2045.5928463623572,1649.4594485457797 2060,1642.5 2045.5928463623572,1635.5405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1940.5" y="1830" width="99.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1950.5" y="1850.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Continúa</text><polyline points="2220.0,570 2220.0,720 525.0,720 525.0,940" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="518.0405514542203,925.5928463623571 525.0,940 531.9594485457797,925.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1218.5" y="675" width="163.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1228.5" y="695.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Coordina el flujo</text><polyline points="2808.0,1185 2808.0,1370 525.0,1370 525.0,1520" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="518.0405514542203,1505.5928463623572 525.0,1520 531.9594485457797,1505.5928463623572" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1357.5" y="1325" width="285.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1367.5" y="1345.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Solo operación nueva y válida</text><polyline points="1505.0,1185 1505,1430 2485,1430 2485.0,1520" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="2478.0405514542203,1505.5928463623572 2485.0,1520 2491.9594485457797,1505.5928463623572" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1928.5" y="1390" width="363.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1938.5" y="1410.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Reenvío idéntico: mismo registro / 200</text><rect x="100" y="2130" width="2800" height="145" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="120" y="2166.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Salida durable y continuación</text><text x="120" y="2202.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">El cliente conserva el borrador hasta recibir confirmación durable. El trabajador genera el PDF y procesa el aviso después; no bloquea la respuesta de recepción. Un fallo posterior de correo no revierte el acta.</text><rect x="100" y="2330" width="2800" height="125" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="120" y="2366.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Responsabilidades conservadas</text><text x="120" y="2402.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">El controlador traduce HTTP; Operativos controla asignación; el dominio protege invariantes; el almacén verifica custodia; el repositorio asegura unicidad y atomicidad. La fachada coordina estas responsabilidades.</text><polyline points="65,2510 2935,2510" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2541.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2574.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Continua: coordinación / orden · Cada colaborador conserva su contrato · La comprobación de aplicación se complementa con unicidad en PostgreSQL</text><text x="65" y="2635.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>