<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2420" viewBox="0 0 3000 2420" role="img"><title>arquitectura-limpia-sifitur · SIFITUR Huamanga</title><desc>Discontinua abierta: importación / dependencia · Discontinua con triángulo: realización · Continua: acceso técnico · Frontera discontinua: núcleo</desc><rect width="100%" height="100%" fill="white"/><rect x="18" y="18" width="2964" height="2384" rx="0" fill="white" stroke="#a6b3bf" stroke-width="2"/><text x="65" y="62.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#447a9e">SIFITUR HUAMANGA  /  ARQUITECTURA Y DISEÑO</text><text x="65" y="116.52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18344e">Clean Architecture · reglas, casos de uso y adaptadores</text><text x="65" y="156.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Dependencias de código hacia el núcleo · registro, custodia y emisión de actas</text><polyline points="65,183 2935,183" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><polyline points="55,240 1985,240 1985,1580 55,1580 55,240" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="273.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">NÚCLEO DEL MÓDULO · INDEPENDIENTE DEL FRAMEWORK</text><rect x="95" y="360" width="1840" height="300" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="95" y="360" width="1840" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="113" y="384.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">CASOS DE USO</text><text x="113" y="418.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Capa de aplicación</text><text x="113" y="475.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">registrar-inspeccion.caso-uso.ts · autoriza, deduplica y coordina T1</text><text x="113" y="503.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">procesar-acta.caso-uso.ts · genera PDF, custodia y confirma T2</text><text x="113" y="531.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Entrada: comando + actor / evento estable · Salida: Registro / Resultado</text><text x="113" y="559.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Importa entidades, errores y contratos del dominio</text><rect x="95" y="970" width="1840" height="390" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="95" y="970" width="1840" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="113" y="994.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ENTIDADES · OBJETOS DE VALOR · PUERTOS</text><text x="113" y="1028.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Capa de dominio</text><text x="113" y="1085.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">inspeccion.ts · operación, ficha, evidencias y firma; crear() / huella()</text><text x="113" y="1113.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">evidencia.ts · objetoId, SHA-256, GPS y origen cámara</text><text x="113" y="1141.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">contratos.ts · RepositorioInspecciones, AlmacenEvidencias, GeneradorActas, Notificador</text><text x="113" y="1169.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">errores.ts · validación, integridad y conflicto</text><text x="113" y="1197.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Invariantes: evidencia válida; operación estable; custodia verificable</text><text x="113" y="1225.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Sin importaciones de NestJS, ORM, SDK, red ni disco</text><polyline points="1015.0,660 1015.0,815.0 1015.0,970" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1008.0405514542203,955.5928463623571 1015.0,970 1021.9594485457797,955.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="856.0" y="790" width="328.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="866.0" y="810.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Importa y usa contratos del núcleo</text><rect x="2200" y="300" width="730" height="320" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="2200" y="300" width="730" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="2218" y="324.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">CAPA EXTERNA</text><text x="2218" y="358.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Presentación REST</text><text x="2218" y="415.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">inspection.controller.ts</text><text x="2218" y="443.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">DTO + actor autenticado</text><text x="2218" y="471.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Traducción a 201 / 200 / 409 / 422</text><text x="2218" y="499.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">401 / 403 según autorización</text><polyline points="2200,460.0 2067.5,460.0 2067.5,510.0 1935,510.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1949.4071536376428,503.0405514542203 1935,510.0 1949.4071536376428,516.9594485457797" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1963.5" y="420" width="193.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1973.5" y="440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Invoca caso de uso</text><rect x="2200" y="990" width="730" height="370" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="2200" y="990" width="730" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="2218" y="1014.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADORES CONCRETOS</text><text x="2218" y="1048.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Infraestructura</text><text x="2218" y="1105.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">repositorio-postgres.ts → SQL / T1 / T2</text><text x="2218" y="1133.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">almacen-s3.ts → objetos + hash</text><text x="2218" y="1161.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">generador-actas-pdf.ts → bytes PDF</text><text x="2218" y="1189.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">notificador-institucional.ts → pasarela</text><text x="2218" y="1217.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Implementa contratos del dominio</text><polyline points="2200,1175.0 2067.5,1175.0 2067.5,1165.0 1935,1165.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1935,1165.0 1949.4071536376428,1158.0405514542203 1949.4071536376428,1171.9594485457797" fill="white" stroke="#63768a" stroke-width="2"/><rect x="1973.0" y="1100" width="174.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1983.0" y="1120.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contratos</text><rect x="95" y="1760" width="1840" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="95" y="1760" width="1840" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="113" y="1784.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ENSAMBLAJE DEL MÓDULO</text><text x="113" y="1818.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">inspecciones.module.ts · raíz de composición</text><text x="113" y="1875.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">NestJS registra implementaciones y resuelve inyección por contrato</text><text x="113" y="1903.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">index.ts exporta la API pública del módulo</text><text x="113" y="1931.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">La entrada HTTP y la entrada del worker conectan los casos de uso</text><text x="113" y="1959.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Es el punto que conoce núcleo y clases de infraestructura</text><rect x="2200" y="1760" width="730" height="265" rx="0" fill="#eef0f2" stroke="#707c86" stroke-width="2"/><rect x="2200" y="1760" width="730" height="83" rx="0" fill="#707c86" stroke="none" stroke-width="2"/><text x="2218" y="1784.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">DEPENDENCIAS TÉCNICAS</text><text x="2218" y="1818.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Recursos externos al núcleo</text><text x="2218" y="1875.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">PostgreSQL · S3 compatible</text><text x="2218" y="1903.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Biblioteca PDF · SMS/correo</text><text x="2218" y="1931.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">RabbitMQ en entrada del worker</text><polyline points="2565.0,1360 2565.0,1560.0 2565.0,1760" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="2558.0405514542203,1745.5928463623572 2565.0,1760 2571.9594485457797,1745.5928463623572" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="2465.0078125" y="1540" width="199.984375" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="2475.0078125" y="1560.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">SDK / SQL / HTTPS</text><polyline points="1935,1892.5 2040,1892.5 2040,510 1935,510.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1949.4071536376428,503.0405514542203 1935,510.0 1949.4071536376428,516.9594485457797" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1953.0" y="1640" width="174.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1963.0" y="1660.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Inyecta contratos</text><rect x="95" y="2120" width="2830" height="125" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="115" y="2156.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Lectura de las dependencias</text><text x="115" y="2192.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">La ejecución invoca un adaptador mediante una interfaz; la dependencia de código del adaptador apunta al contrato del núcleo. Cambiar PostgreSQL, S3 o el proveedor de correo conserva los casos de uso y las entidades.</text><polyline points="65,2260 2935,2260" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2291.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2324.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Discontinua abierta: importación / dependencia · Discontinua con triángulo: realización · Continua: acceso técnico · Frontera discontinua: núcleo</text><text x="65" y="2385.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>