<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2430" viewBox="0 0 2800 2430" role="img"><title>patron-adapter · SIFITUR Huamanga</title><desc>Continua: colaboración / flujo · Discontinua: dependencia · Triángulo hueco: realización de interfaz</desc><rect width="100%" height="100%" fill="white"/><rect x="18" y="18" width="2764" height="2394" rx="0" fill="white" stroke="#a6b3bf" stroke-width="2"/><text x="65" y="62.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#447a9e">SIFITUR HUAMANGA  /  ARQUITECTURA Y DISEÑO</text><text x="65" y="116.52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18344e">Adapter · contrato de custodia y proveedor S3</text><text x="65" y="156.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Colaboración UML del módulo Inspecciones · contrato, implementación y recurso técnico</text><polyline points="65,183 2735,183" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><polyline points="55,235 2745,235 2745,935 55,935 55,235" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="268.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">NÚCLEO · APLICACIÓN Y CONTRATO DE DOMINIO</text><rect x="100" y="370" width="1050" height="315" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="100" y="370" width="1050" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="118" y="394.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">CLIENTE DEL CONTRATO</text><text x="118" y="428.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RegistrarInspeccionCasoUso</text><text x="118" y="485.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">- repositorio: RepositorioInspecciones</text><text x="118" y="513.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">- almacen: AlmacenEvidencias</text><polyline points="101,519 1149,519" fill="none" stroke="#8cafcb" stroke-width="1" stroke-linejoin="round"/><text x="118" y="550.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ ejecutar(cmd, actor): Registro</text><text x="118" y="578.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Coordina reglas y solicita operaciones por contrato</text><rect x="1640" y="370" width="1050" height="315" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="1640" y="370" width="1050" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="1658" y="394.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«interface» · PUERTO DEL NÚCLEO</text><text x="1658" y="428.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">AlmacenEvidencias</text><text x="1658" y="485.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ verificar(objetoId, hash): boolean</text><text x="1658" y="513.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ guardarActa(id, bytes): Objeto</text><text x="1658" y="541.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Resultado: referencia estable y SHA-256</text><polyline points="1150,527.5 1395.0,527.5 1640,527.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1625.5928463623572,534.4594485457797 1640,527.5 1625.5928463623572,520.5405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1321.0" y="485" width="158.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1331.0" y="505.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Invoca contrato</text><rect x="100" y="755" width="1150" height="160" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="120" y="791.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Garantía observable del contrato</text><text x="120" y="827.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Objeto existente + hash esperado → verificación positiva. Objeto ausente o alterado → error de integridad. Guardar</text><text x="120" y="855.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">acta usa identificador estable; el núcleo recibe referencia y hash.</text><polyline points="55,1170 2745,1170 2745,1785 55,1785 55,1170" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="1203.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">INFRAESTRUCTURA · IMPLEMENTACIÓN Y RECURSO EXTERNO</text><rect x="1640" y="1300" width="1050" height="315" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="1640" y="1300" width="1050" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="1658" y="1324.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADOR CONCRETO</text><text x="1658" y="1358.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">AlmacenEvidenciasS3</text><text x="1658" y="1415.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">- cliente: ClienteS3</text><polyline points="1641,1421 2689,1421" fill="none" stroke="#8cafcb" stroke-width="1" stroke-linejoin="round"/><text x="1658" y="1452.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ verificar(id, hash): boolean</text><text x="1658" y="1480.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">+ guardarActa(id, bytes): Objeto</text><text x="1658" y="1508.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Traduce SDK, metadatos y errores del proveedor</text><rect x="100" y="1300" width="1050" height="315" rx="0" fill="#e3f1f8" stroke="#006b9f" stroke-width="2"/><rect x="100" y="1300" width="1050" height="83" rx="0" fill="#006b9f" stroke="none" stroke-width="2"/><text x="118" y="1324.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">RECURSO TÉCNICO</text><text x="118" y="1358.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Servicio de objetos S3 compatible</text><text x="118" y="1415.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Objetos privados: originales, firma y PDF</text><text x="118" y="1443.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">SHA-256 + metadatos + versión</text><text x="118" y="1471.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Política de retención / acceso temporal</text><text x="118" y="1499.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Sin archivos permanentes en la instancia API</text><polyline points="2165.0,1300 2165.0,992.5 2165.0,685" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="2165.0,685 2171.9594485457797,699.4071536376429 2158.0405514542203,699.4071536376429" fill="white" stroke="#63768a" stroke-width="2"/><rect x="2086.5" y="1020" width="157.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="2096.5" y="1040.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza interfaz</text><polyline points="1640,1457.5 1395.0,1457.5 1150,1457.5" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1164.4071536376428,1450.5405514542203 1150,1457.5 1164.4071536376428,1464.4594485457797" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1283.5078125" y="1420" width="222.984375" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1293.5078125" y="1440.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">HTTPS / S3 API · SDK</text><rect x="100" y="1910" width="2590" height="155" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="120" y="1946.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Recorrido y recuperación</text><text x="120" y="1982.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">1. Caso de uso invoca el puerto → 2. adaptador consulta S3 → 3. verifica referencia y hash → 4. devuelve resultado tipado. Un fallo externo impide confirmar integridad; no se sustituye el original.</text><rect x="100" y="2110" width="2590" height="120" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="120" y="2146.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Límite de responsabilidad</text><text x="120" y="2182.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Cambiar el proveedor modifica el adaptador y la composición. RegistrarInspeccionCasoUso e Inspeccion no importan SDK ni conocen credenciales o endpoints del proveedor.</text><polyline points="65,2270 2735,2270" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2301.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2334.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Continua: colaboración / flujo · Discontinua: dependencia · Triángulo hueco: realización de interfaz</text><text x="65" y="2395.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>