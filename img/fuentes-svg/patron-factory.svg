ll="#eaf1f7" stroke="none" stroke-width="2"/><text x="78" y="1205.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142d45">Responsabilidad</text><text x="78" y="1238.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a">Centraliza invariantes del agregado. La autorización, consulta de asignación y persistencia corresponden al caso de uso, fuera de esta fábrica.</text><polyline points="55,1328 2345,1328" fill="none" stroke="#c8d4df" stroke-width="2" stroke-linejoin="round"/><text x="55" y="1363.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#52687a">Azul: canal / aplicación · Verde: negocio · Violeta: contrato / adaptador · Ámbar: datos · Gris: externo</text><text x="55" y="1399.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52687a">SIFITUR Huamanga · IS-488 · Diseño propuesto · Flechas rotuladas: sentido de la relación</text></svg>