 DOMINIO · RN-01 / RN-02 / RN-03</text><rect x="95" y="1020" width="810" height="250" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="95" y="1020" width="810" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="113" y="1044.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">PASO DE CREACIÓN</text><text x="113" y="1078.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">01 · Identidad de captura</text><text x="113" y="1135.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Operación, inspector y prestador presentes</text><text x="113" y="1163.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Ficha y fecha de captura coherentes</text><rect x="995" y="1020" width="810" height="250" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="995" y="1020" width="810" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="1013" y="1044.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">PASO DE CREACIÓN</text><text x="1013" y="1078.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">02 · Evidencia y firma</text><text x="1013" y="1135.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Evidencia.crear verifica GPS y SHA-256</text><text x="1013" y="1163.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Origen cámara; firma vinculada a inspección</text><rect x="1895" y="1020" width="810" height="250" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="1895" y="1020" width="810" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="1913" y="1044.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">PASO DE CREACIÓN</text><text x="1913" y="1078.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">03 · Construcción completa</text><text x="1913" y="1135.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">No devuelve entidades parciales</text><text x="1913" y="1163.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">La huella usa contenido estable</text><polyline points="905,1145.0 950.0,1145.0 995,1145.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="980.5928463623571,1151.9594485457797 995,1145.0 980.5928463623571,1138.0405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="913.0078125" y="1320" width="73.984375" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="923.0078125" y="1340.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Valida</text><polyline points="1805,1145.0 1850.0,1145.0 1895,1145.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1880.5928463623572,1151.9594485457797 1895,1145.0 1880.5928463623572,1138.0405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1813.0078125" y="1320" width="73.984375" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1823.0078125" y="1340.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Valida</text><polyline points="1445.0,710 1445,810 1400.0,810 1400.0,1020" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1393.0405514542203,1005.5928463623571 1400.0,1020 1406.9594485457797,1005.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1357.5" y="775" width="175.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1367.5" y="795.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Aplica invariantes</text><rect x="1020" y="1770" width="850" height="235" rx="0" fill="#eef0f2" stroke="#707c86" stroke-width="2"/><rect x="1020" y="1770" width="850" height="83" rx="0" fill="#707c86" stroke="none" stroke-width="2"/><text x="1038" y="1794.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ALTERNATIVA DE VALIDACIÓN</text><text x="1038" y="1828.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Error de dominio</text><text x="1038" y="1885.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Identidad, evidencia, firma o ficha inválida</text><text x="1038" y="1913.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">No construye agregado; caso de uso propaga error</text><text x="1038" y="1941.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">El controlador traduce a 422</text><polyline points="1400.0,1270 1400,1640 1445.0,1640 1445.0,1770" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1438.0405514542203,1755.5928463623572 1445.0,1770 1451.9594485457797,1755.5928463623572" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1303.5" y="1600" width="193.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1313.5" y="1620.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Falla una invariante</text><rect x="70" y="2070" width="2660" height="100" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="90" y="2106.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Límite de la fábrica</text><text x="90" y="2142.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">La asignación del operativo, la autorización del actor y la comprobación real de objetos en S3 corresponden al caso de uso. La fábrica estática valida el modelo; no requiere una jerarquía Factory Method.</text><polyline points="65,2170 2735,2170" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2201.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2234.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Continua: creación / validación · {static}: operación de clase · La verificación de archivos externos y la transacción se realizan después desde aplicación</text><text x="65" y="2295.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>