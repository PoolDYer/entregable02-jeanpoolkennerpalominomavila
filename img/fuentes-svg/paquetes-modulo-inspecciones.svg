1" font-weight="400" fill="#18344e">Importa solo dominio y sus contratos</text><rect x="95" y="1238" width="190" height="32" rx="0" fill="#e7f0f8" stroke="#9aafc1" stroke-width="2"/><rect x="95" y="1270" width="1140" height="390" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="95" y="1270" width="1140" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="113" y="1294.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«package» · ARCHIVOS Y RESPONSABILIDADES</text><text x="113" y="1328.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">infraestructura/</text><text x="113" y="1385.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">repositorio-postgres.ts → RepositorioInspecciones</text><text x="113" y="1413.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">almacen-s3.ts → AlmacenEvidencias</text><text x="113" y="1441.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">generador-actas-pdf.ts → GeneradorActas</text><text x="113" y="1469.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">notificador-institucional.ts → Notificador</text><text x="113" y="1497.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Encapsula SQL, SDK, PDF y pasarela</text><rect x="1760" y="1238" width="190" height="32" rx="0" fill="#e7f0f8" stroke="#9aafc1" stroke-width="2"/><rect x="1760" y="1270" width="1140" height="390" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="1760" y="1270" width="1140" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="1778" y="1294.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«package» · ARCHIVOS Y RESPONSABILIDADES</text><text x="1778" y="1328.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">dominio/</text><text x="1778" y="1385.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">inspeccion.ts → Inspeccion.crear / huella</text><text x="1778" y="1413.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">evidencia.ts → Evidencia / GPS / SHA-256</text><text x="1778" y="1441.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">contratos.ts → repositorio, almacén, generador, notificador</text><text x="1778" y="1469.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">errores.ts → validación, integridad y conflicto</text><text x="1778" y="1497.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Sin dependencias hacia otras capas</text><polyline points="1235,595.0 1497.5,595.0 1760,595.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1745.5928463623572,601.9594485457797 1760,595.0 1745.5928463623572,588.0405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1351.0" y="530" width="288.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1361.0" y="550.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Importa / invoca casos de uso</text><polyline points="2330.0,790 2330.0,1030.0 2330.0,1270" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="2323.0405514542203,1255.5928463623572 2330.0,1270 2336.9594485457797,1255.5928463623572" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="2195.0" y="1020" width="270.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="2205.0" y="1040.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Importa entidades y puertos</text><polyline points="1235,1465.0 1497.5,1465.0 1760,1465.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1760,1465.0 1745.5928463623572,1471.9594485457797 1745.5928463623572,1458.0405514542203" fill="white" stroke="#63768a" stroke-width="2"/><rect x="1360.0" y="1400" width="270.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1370.0" y="1420.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contratos del núcleo</text><rect x="95" y="1910" width="2800" height="215" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="95" y="1910" width="2800" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="113" y="1934.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ARCHIVO DE COMPOSICIÓN</text><text x="113" y="1968.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">inspecciones.module.ts · raíz de composición</text><text x="113" y="2025.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Registra providers y conecta los contratos con sus adaptadores concretos.</text><text x="113" y="2053.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Inyecta dependencias en los casos de uso; conecta controladores y entrada del trabajador.</text><text x="113" y="2081.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Único punto de ensamblaje con conocimiento de todas las capas.</text><polyline points="669.0,1910 669.0,1800 665,1800 665.0,1660" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="671.9594485457797,1674.4071536376428 665.0,1660 658.0405514542203,1674.4071536376428" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="535.0" y="1750" width="260.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="545.0" y="1770.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Registra implementaciones</text><polyline points="1523.0,1910 1523.0,1820 1520,1820 1520,1050 1690,1050 1690,595 1760,595.0" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1745.5928463623572,601.9594485457797 1760,595.0 1745.5928463623572,588.0405514542203" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><rect x="1410.5" y="1750" width="209.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1420.5" y="1770.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Inyecta casos de uso</text><rect x="95" y="2310" width="1170" height="205" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="95" y="2310" width="1170" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="113" y="2334.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">FRONTERA PÚBLICA</text><text x="113" y="2368.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">index.ts · API pública del módulo</text><text x="113" y="2425.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Exportaciones autorizadas para otros módulos</text><text x="113" y="2453.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">No expone los repositorios ni los SDK internos</text><rect x="1515" y="2310" width="1380" height="180" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="1535" y="2346.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Regla de importaciones</text><text x="1535" y="2382.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Presentación → Aplicación → Dominio. Infraestructura → contratos de Dominio. Los demás módulos colaboran mediante la API pública,</text><text x="1535" y="2410.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">respetando la propiedad de datos.</text><polyline points="65,2560 2935,2560" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2591.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2624.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Discontinua abierta: dependencia de código · Triángulo hueco: realización de contrato · Pestaña superior: paquete UML · Composición conecta las capas</text><text x="65" y="2685.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>