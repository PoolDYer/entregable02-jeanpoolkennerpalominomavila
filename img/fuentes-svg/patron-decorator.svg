<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1740" viewBox="0 0 2600 1740" role="img"><title>patron-decorator</title><rect width="100%" height="100%" fill="#f6f8fb"/><rect x="0" y="0" width="2600" height="145" rx="0" fill="#142d45" stroke="none" stroke-width="2"/><text x="55" y="37.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#90c5d5">SIFITUR HUAMANGA  /  ARQUITECTURA DE SOFTWARE</text><text x="55" y="86.52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="white">Decorator · Consulta pública con caché</text><text x="55" y="127.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#d1e0ed">Alcance: mismo contrato, consulta válida y caducidad explícita · RF13 / ADR-003</text><rect x="70" y="250" width="660" height="230" rx="12" fill="white" stroke="#19705d" stroke-width="2"/><rect x="72" y="252" width="7" height="226" rx="2" fill="#19705d" stroke="none" stroke-width="2"/><text x="92" y="278.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#19705d">CLIENTE</text><text x="92" y="313.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">PublicQueryService</text><polyline points="92,329 708,329" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="92" y="355.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Solicita ficha pública autorizada</text><text x="92" y="381.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">No depende de Redis</text><rect x="1100" y="250" width="1430" height="230" rx="12" fill="white" stroke="#685298" stroke-width="2"/><rect x="1102" y="252" width="7" height="226" rx="2" fill="#685298" stroke="none" stroke-width="2"/><text x="1122" y="278.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#685298">«interface»</text><text x="1122" y="313.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">ConsultaPublicaPort</text><polyline points="1122,329 2508,329" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="1122" y="355.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">+ consultar(prestadorId): FichaPublica</text><text x="1122" y="381.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Incluye versión y fecha de generación</text><polyline points="730,365.0 915.0,365.0 1100,365.0" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><polyline points="1085.5928463623572,371.9594485457797 1100,365.0 1085.5928463623572,358.0405514542203" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><rect x="875.5" y="325" width="79.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="885.5" y="345.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Invoca</text><rect x="1100" y="890" width="620" height="230" rx="12" fill="white" stroke="#685298" stroke-width="2"/><rect x="1102" y="892" width="7" height="226" rx="2" fill="#685298" stroke="none" stroke-width="2"/><text x="1122" y="918.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#685298">DECORADOR</text><text x="1122" y="953.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">CacheRepository</text><polyline points="1122,969 1698,969" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="1122" y="995.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Decora ConsultaPublicaPort</text><text x="1122" y="1021.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Acierto vigente → devuelve</text><text x="1122" y="1047.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Fallo / vencido → delega</text><rect x="1910" y="890" width="620" height="230" rx="12" fill="white" stroke="#685298" stroke-width="2"/><rect x="1912" y="892" width="7" height="226" rx="2" fill="#685298" stroke="none" stroke-width="2"/><text x="1932" y="918.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#685298">COMPONENTE CONCRETO</text><text x="1932" y="953.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">ConsultaPublicaRepository</text><polyline points="1932,969 2508,969" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="1932" y="995.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Lee proyección en primaria</text><text x="1932" y="1021.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Revalida formalidad</text><polyline points="1410.0,890 1410.0,685.0 1815.0,685.0 1815.0,480" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1815.0,480 1821.9594485457797,494.4071536376428 1808.0405514542203,494.4071536376428" fill="white" stroke="#657e8e" stroke-width="2"/><rect x="1347.5" y="670" width="125.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1357.5" y="690.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Implementa</text><polyline points="2220.0,890 2220.0,685.0 1815.0,685.0 1815.0,480" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1815.0,480 1821.9594485457797,494.4071536376428 1808.0405514542203,494.4071536376428" fill="white" stroke="#657e8e" stroke-width="2"/><rect x="2152.5" y="670" width="125.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="2162.5" y="690.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Implementa</text><polyline points="1720,1005.0 1815.0,1005.0 1910,1005.0" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><polyline points="1895.5928463623572,1011.9594485457797 1910,1005.0 1895.5928463623572,998.0405514542203" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><rect x="1774.0" y="975" width="82.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1784.0" y="995.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Delega</text><rect x="70" y="890" width="660" height="230" rx="12" fill="white" stroke="#9b6b23" stroke-width="2"/><rect x="72" y="892" width="7" height="226" rx="2" fill="#9b6b23" stroke="none" stroke-width="2"/><text x="92" y="918.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9b6b23">CACHÉ</text><text x="92" y="953.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">Redis</text><polyline points="92,969 708,969" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="92" y="995.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Solo campos públicos</text><text x="92" y="1021.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">TTL desde generación ≤ 60 s</text><polyline points="1100,1005.0 915.0,1005.0 730,1005.0" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><polyline points="744.4071536376429,998.0405514542203 730,1005.0 744.4071536376429,1011.9594485457797" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><rect x="790.5" y="970" width="249.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="800.5" y="990.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Lee / escribe · RESP/TLS</text><rect x="55" y="1390" width="2490" height="112" rx="12" fill="#eaf1f7" stroke="none" stroke-width="2"/><text x="78" y="1425.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142d45">Caducidad segura</text><text x="78" y="1458.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a">Un hit no renueva la antigüedad. Si no puede revalidar una ficha vencida, no acredita formalidad. Evento de cambio invalida / reemplaza; Redis puede reconstruirse.</text><polyline points="55,1638 2545,1638" fill="none" stroke="#c8d4df" stroke-width="2" stroke-linejoin="round"/><text x="55" y="1673.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#52687a">Continua: invoca o delega · Discontinua con triángulo hueco: realización · Decorador y componente conservan el mismo contrato.</text><text x="55" y="1709.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#52687a">SIFITUR Huamanga · IS-488 · Diseño propuesto · Flechas rotuladas: sentido de la relación</text></svg>