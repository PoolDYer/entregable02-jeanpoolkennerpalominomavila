ect x="1535" y="1850" width="1360" height="180" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="1555" y="1886.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">RN-02 / RN-05 · evidencia verificable</text><text x="1555" y="1922.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Al menos una evidencia de cámara con GPS válido.</text><text x="1555" y="1950.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Referencia, metadatos y SHA-256 deben coincidir.</text><rect x="95" y="2075" width="1360" height="180" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="115" y="2111.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">RN-04 · idempotencia</text><text x="115" y="2147.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Misma operación + misma huella → mismo registro.</text><text x="115" y="2175.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Misma operación + otra huella → conflicto; no sobrescribe.</text><rect x="1535" y="2075" width="1360" height="180" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="1555" y="2111.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">RN-06 / RN-07 · emisión y entrega</text><text x="1555" y="2147.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">PDF y hash conservados antes de confirmar EMITIDA.</text><text x="1555" y="2175.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Error de notificación conserva el acta y la tarea durable.</text><polyline points="65,2540 2935,2540" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2571.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2604.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Rombo lleno junto a Inspeccion: composición · 1..*: una o más partes · 0..1: acta pendiente · Subsanacion conserva su propio ciclo de vida</text><text x="65" y="2665.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>