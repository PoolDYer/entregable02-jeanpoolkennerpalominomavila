  <!-- RELACIONES IZQUIERDA (ACTORES -> SIFITUR)  -->
  <!-- ========================================== -->

  <!-- Relación 1: Inspector -> SIFITUR -->
  <polyline points="530,330 820,330 820,710 910,710" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-1">
    <rect x="545" y="311" width="260" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="675" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Registra actas y evidencias</text>
  </g>

  <!-- Relación 2: Coordinador -> SIFITUR -->
  <polyline points="530,605 740,605 740,795 910,795" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-2">
    <rect x="535" y="586" width="200" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="635" y="605" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Gestiona fiscalización</text>
  </g>

  <!-- Relación 3: Administrador TI -> SIFITUR -->
  <line x1="530" y1="880" x2="910" y2="880" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-3">
    <rect x="630" y="861" width="180" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="720" y="880" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Controla accesos</text>
  </g>

  <!-- Relación 4: Prestador -> SIFITUR -->
  <polyline points="530,1155 740,1155 740,965 910,965" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-4">
    <rect x="540" y="1136" width="190" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="635" y="1155" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Presenta descargos</text>
  </g>

  <!-- Relación 5: Turista -> SIFITUR -->
  <polyline points="530,1430 820,1430 820,1050 910,1050" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-5">
    <rect x="550" y="1411" width="250" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="675" y="1430" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Verifica formalidad y QR</text>
  </g>

  <!-- ========================================== -->
  <!-- RELACIONES DERECHA (SIFITUR -> EXTERNOS)   -->
  <!-- ========================================== -->

  <!-- Relación 6: SIFITUR -> SUNAT RUC -->
  <polyline points="1590,730 1680,730 1680,380 1970,380" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-6">
    <rect x="1745" y="361" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1825" y="380" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Consulta RUC</text>
  </g>

  <!-- Relación 7: SIFITUR -> MINCETUR -->
  <polyline points="1590,830 1760,830 1760,715 1970,715" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-7">
    <rect x="1785" y="696" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1865" y="715" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Valida registro</text>
  </g>

  <!-- Relación 8: SIFITUR -> OpenStreetMap -->
  <polyline points="1590,930 1760,930 1760,1045 1970,1045" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-8">
    <rect x="1785" y="1026" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1865" y="1045" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Obtiene mapas</text>
  </g>

  <!-- Relación 9: SIFITUR -> Pasarela SMS -->
  <polyline points="1590,1030 1680,1030 1680,1380 1970,1380" fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g id="badge-rel-9">
    <rect x="1745" y="1361" width="160" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1825" y="1380" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#142d45" text-anchor="middle" dominant-baseline="central">Solicita envío</text>
  </g>

  <!-- ========================================== -->
  <!-- SECCIÓN: ACCESO A LA INFORMACIÓN           -->
  <!-- ========================================== -->
  <g id="seccion-acceso">
    <rect x="70" y="1640" width="2360" height="96" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="96" y="1676" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Acceso a la información</text>
    <text x="96" y="1710" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#475569">QR y directorio: información pública. Actas, firmas, evidencias y descargos: acceso por rol y expediente. Integraciones externas sujetas a habilitación institucional.</text>
  </g>

  <!-- ========================================== -->
  <!-- LEYENDA C4 (4 COLUMNAS x 2 FILAS)          -->
  <!-- ========================================== -->
  <g id="leyenda-c4">
    <rect x="350" y="1800" width="1800" height="230" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="350" y="1768" width="160" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="430" y="1784" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle" dominant-baseline="central">Leyenda C4</text>

    <!-- Fila 1 (Y = 1860) -->
    <!-- Columna 1: Sistema -->
    <rect x="420" y="1838" width="64" height="44" rx="4" fill="#07569a"/>
    <text x="504" y="1860" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Sistema</text>

    <!-- Columna 2: Contenedor -->
    <rect x="840" y="1838" width="64" height="44" rx="4" fill="#2f7cba"/>
    <text x="924" y="1860" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Contenedor</text>

    <!-- Columna 3: Persona / usuario -->
    <ellipse cx="1292" cy="1847" rx="14" ry="14" fill="#07385b"/>
    <rect x="1268" y="1855" width="48" height="27" rx="10" fill="#07385b"/>
    <text x="1336" y="1860" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Persona / usuario</text>

    <!-- Columna 4: Límite -->
    <rect x="1680" y="1838" width="64" height="44" rx="4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1764" y="1860" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Límite</text>

    <!-- Fila 2 (Y = 1955) -->
    <!-- Columna 1: Componente -->
    <rect x="420" y="1933" width="64" height="44" rx="4" fill="#68afea"/>
    <text x="504" y="1955" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Componente</text>

    <!-- Columna 2: Sistema externo -->
    <rect x="840" y="1933" width="64" height="44" rx="4" fill="#788896"/>
    <text x="924" y="1955" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Sistema externo</text>

    <!-- Columna 3: Almacén de datos -->
    <rect x="1266" y="1938" width="52" height="34" fill="#006bb7"/>
    <ellipse cx="1292" cy="1938" rx="26" ry="9" fill="#006bb7"/>
    <ellipse cx="1292" cy="1972" rx="26" ry="9" fill="#006bb7"/>
    <text x="1336" y="1955" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Almacén de datos</text>

    <!-- Columna 4: Relación -->
    <line x1="1680" y1="1955" x2="1736" y2="1955" stroke="#666666" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="1764" y="1955" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#334155" dominant-baseline="central">Relación</text>
  </g>

  <!-- Pie de página -->
  <text x="70" y="2080" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#64748b">Las relaciones indican su propósito y protocolo. Diseño propuesto de SIFITUR Huamanga.</text>
</svg>
