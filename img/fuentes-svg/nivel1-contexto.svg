<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="2130" viewBox="0 0 2500 2130" role="img">
  <title>nivel1-contexto · SIFITUR Huamanga</title>
  <defs>
    <!-- Marcador de flecha para las relaciones -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- Fondo y marco general -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="20" width="2460" height="2090" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Encabezado del diagrama -->
  <text x="1250" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1e293b" text-anchor="middle">Diagrama de contexto</text>
  <text x="1250" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="middle">SIFITUR Huamanga · Personas, fiscalización turística y sistemas externos</text>

  <!-- ========================================== -->
  <!-- ACTORES / PERSONAS (COLUMNA IZQUIERDA)      -->
  <!-- Centrados en X = 300 (rango: 70 a 530)     -->
  <!-- ========================================== -->

  <!-- Actor 1: Inspector de campo (Centro Y = 330) -->
  <g id="actor-inspector">
    <ellipse cx="300" cy="230" rx="28" ry="28" fill="#07385b"/>
    <rect x="220" y="240" width="160" height="42" rx="16" fill="#07385b"/>
    <rect x="70" y="265" width="460" height="130" rx="36" fill="#07385b"/>
    <text x="300" y="318" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Inspector de campo</text>
    <text x="300" y="352" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Captura y sincroniza inspecciones</text>
  </g>

  <!-- Actor 2: Coordinador DIRCETUR / MPH (Centro Y = 605) -->
  <g id="actor-coordinador">
    <ellipse cx="300" cy="505" rx="28" ry="28" fill="#07385b"/>
    <rect x="220" y="515" width="160" height="42" rx="16" fill="#07385b"/>
    <rect x="70" y="540" width="460" height="130" rx="36" fill="#07385b"/>
    <text x="300" y="593" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Coordinador DIRCETUR / MPH</text>
    <text x="300" y="627" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Planifica y resuelve expedientes</text>
  </g>

  <!-- Actor 3: Administrador TI (Centro Y = 880) -->
  <g id="actor-admin">
    <ellipse cx="300" cy="780" rx="28" ry="28" fill="#07385b"/>
    <rect x="220" y="790" width="160" height="42" rx="16" fill="#07385b"/>
    <rect x="70" y="815" width="460" height="130" rx="36" fill="#07385b"/>
    <text x="300" y="868" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Administrador TI</text>
    <text x="300" y="902" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Administra usuarios y permisos</text>
  </g>

  <!-- Actor 4: Prestador turístico (Centro Y = 1155) -->
  <g id="actor-prestador">
    <ellipse cx="300" cy="1055" rx="28" ry="28" fill="#07385b"/>
    <rect x="220" y="1065" width="160" height="42" rx="16" fill="#07385b"/>
    <rect x="70" y="1090" width="460" height="130" rx="36" fill="#07385b"/>
    <text x="300" y="1143" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Prestador turístico</text>
    <text x="300" y="1177" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Consulta su expediente y subsana</text>
  </g>

  <!-- Actor 5: Turista / ciudadano (Centro Y = 1430) -->
  <g id="actor-turista">
    <ellipse cx="300" cy="1330" rx="28" ry="28" fill="#07385b"/>
    <rect x="220" y="1340" width="160" height="42" rx="16" fill="#07385b"/>
    <rect x="70" y="1365" width="460" height="130" rx="36" fill="#07385b"/>
    <text x="300" y="1418" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Turista / ciudadano</text>
    <text x="300" y="1452" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Consulta pública sin sesión</text>
  </g>

  <!-- ========================================== -->
  <!-- SISTEMA EN ALCANCE (CENTRO)                -->
  <!-- Centrado en X = 1250, Y = 880 (910 a 1590) -->
  <!-- ========================================== -->
  <g id="sistema-sifitur">
    <rect x="910" y="660" width="680" height="440" rx="8" fill="#07569a"/>
    <text x="1250" y="708" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#bde0fe" text-anchor="middle">«sistema en alcance»</text>
    <text x="1250" y="750" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">SIFITUR Huamanga</text>
    <text x="1250" y="790" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">Sistema Integral de Fiscalización</text>
    <text x="1250" y="820" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">de Hospedajes y Servicios Turísticos</text>
    
    <line x1="1060" y1="855" x2="1440" y2="855" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>

    <text x="1250" y="895" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">Padrón, riesgo, operativos, inspección,</text>
    <text x="1250" y="925" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">actas, subsanaciones y consulta QR.</text>
    <text x="1250" y="990" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">DIRCETUR Ayacucho / MPH</text>
  </g>

  <!-- ========================================== -->
  <!-- SISTEMAS EXTERNOS (COLUMNA DERECHA)        -->
  <!-- Centrados en X = 2200 (rango: 1970 a 2430) -->
  <!-- ========================================== -->

  <!-- Externo 1: SUNAT RUC (Centro Y = 380) -->
  <g id="ext-sunat">
    <rect x="1970" y="280" width="460" height="200" rx="8" fill="#788896"/>
    <text x="2200" y="328" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="middle">«sistema externo»</text>
    <text x="2200" y="372" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">SUNAT RUC</text>
    <text x="2200" y="420" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#f1f5f9" text-anchor="middle">Información tributaria del prestador</text>
  </g>

  <!-- Externo 2: MINCETUR (Centro Y = 715) -->
  <g id="ext-mincetur">
    <rect x="1970" y="615" width="460" height="200" rx="8" fill="#788896"/>
    <text x="2200" y="663" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="middle">«sistema externo»</text>
    <text x="2200" y="707" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">MINCETUR</text>
    <text x="2200" y="755" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#f1f5f9" text-anchor="middle">Registro y constancias sectoriales</text>
  </g>

  <!-- Externo 3: OpenStreetMap / GIS (Centro Y = 1045) -->
  <g id="ext-osm">
    <rect x="1970" y="945" width="460" height="200" rx="8" fill="#788896"/>
    <text x="2200" y="993" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="middle">«sistema externo»</text>
    <text x="2200" y="1037" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">OpenStreetMap / GIS</text>
    <text x="2200" y="1085" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#f1f5f9" text-anchor="middle">Cartografía de referencia</text>
  </g>

  <!-- Externo 4: Pasarela SMS / correo (Centro Y = 1380) -->
  <g id="ext-sms">
    <rect x="1970" y="1280" width="460" height="200" rx="8" fill="#788896"/>
    <text x="2200" y="1328" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#e2e8f0" text-anchor="middle">«sistema externo»</text>
    <text x="2200" y="1372" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">Pasarela SMS / correo</text>
    <text x="2200" y="1420" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#f1f5f9" text-anchor="middle">Actas, avisos y recuperación</text>
  </g>

