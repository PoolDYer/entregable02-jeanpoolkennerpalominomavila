<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2700" viewBox="0 0 3000 2700" role="img"><title>principio-dip · SIFITUR Huamanga</title><desc>Discontinua abierta: dependencia de código · Triángulo hueco: realización · La ejecución usa un objeto concreto detrás del contrato; composición selecciona ese objeto</desc><rect width="100%" height="100%" fill="white"/><rect x="18" y="18" width="2964" height="2664" rx="0" fill="white" stroke="#a6b3bf" stroke-width="2"/><text x="65" y="62.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#447a9e">SIFITUR HUAMANGA  /  ARQUITECTURA Y DISEÑO</text><text x="65" y="116.52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18344e">Inversión de dependencias · contratos del núcleo y ensamblaje</text><text x="65" y="156.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Dependencias de código, realizaciones e inyección explícita · módulo Inspecciones</text><polyline points="65,183 2935,183" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><polyline points="55,235 2945,235 2945,1145 55,1145 55,235" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="268.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">NÚCLEO · APLICACIÓN Y DOMINIO</text><rect x="95" y="340" width="850" height="260" rx="0" fill="#b9dcf5" stroke="#154f79" stroke-width="2"/><rect x="95" y="340" width="850" height="83" rx="0" fill="#154f79" stroke="none" stroke-width="2"/><text x="113" y="364.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">APLICACIÓN · API</text><text x="113" y="398.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RegistrarInspeccionCasoUso</text><text x="113" y="455.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">- repositorio: RepositorioInspecciones</text