</text><text x="2073" y="483.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Evento y destinatario estable</text><text x="2073" y="511.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Persiste resultado antes del acuse</text><rect x="95" y="815" width="660" height="235" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="95" y="815" width="660" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="113" y="839.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«interface» · DOMINIO</text><text x="113" y="873.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RepositorioInspecciones</text><text x="113" y="930.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">buscarOperacion / registrarAtomico</text><text x="113" y="958.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">confirmarActa · unicidad y T1/T2</text><rect x="805" y="815" width="660" height="235" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="805" y="815" width="660" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="823" y="839.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«interface» · DOMINIO</text><text x="823" y="873.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">AlmacenEvidencias</text><text x="823" y="930.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">verificar / guardarActa</text><text x="823" y="958.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Integridad y referencia estable</text><rect x="1515" y="815" width="660" height="235" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="1515" y="815" width="660" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="1533" y="839.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«interface» · DOMINIO</text><text x="1533" y="873.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">GeneradorActas</text><text x="1533" y="930.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">generar(inspeccion): Uint8Array</text><text x="1533" y="958.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Bytes PDF sin biblioteca concreta</text><rect x="2225" y="815" width="660" height="235" rx="0" fill="#d6eafb" stroke="#07569a" stroke-width="2"/><rect x="2225" y="815" width="660" height="83" rx="0" fill="#07569a" stroke="none" stroke-width="2"/><text x="2243" y="839.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">«interface» · DOMINIO</text><text x="2243" y="873.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">Notificador</text><text x="2243" y="930.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">enviar(tarea): ResultadoEnvio</text><text x="2243" y="958.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Contrato para consumidor de avisos</text><polyline points="307.5,600 307.5,670 260.0,670 260.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="253.04055145422032,800.5928463623571 260.0,815 266.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="732.5,600 732.5,710 970.0,710 970.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="963.0405514542203,800.5928463623571 970.0,815 976.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1202.5,600 1202.5,750 590.0,750 590.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="583.0405514542203,800.5928463623571 590.0,815 596.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1415.0,600 1415.0,785 1300.0,785 1300.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1293.0405514542203,800.5928463623571 1300.0,815 1306.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="1755.0,600 1755.0,670 1845.0,670 1845.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="1838.0405514542203,800.5928463623571 1845.0,815 1851.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><polyline points="2480.0,600 2480.0,710 2555.0,710 2555.0,815" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polyline points="2548.0405514542203,800.5928463623571 2555.0,815 2561.9594485457797,800.5928463623571" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round"/><text x="95" y="664.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#53677a">Las flechas de dependencia terminan en el contrato requerido por cada cliente.</text><polyline points="55,1380 2945,1380 2945,1865 55,1865 55,1380" fill="none" stroke="#9aafc1" stroke-width="2" stroke-linejoin="round" stroke-dasharray="10 8"/><text x="73" y="1413.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">INFRAESTRUCTURA · IMPLEMENTACIONES SUSTITUIBLES</text><rect x="95" y="1500" width="660" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="95" y="1500" width="660" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="113" y="1524.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADOR</text><text x="113" y="1558.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">RepositorioInspeccionesPostgres</text><text x="113" y="1615.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Driver SQL / restricciones únicas</text><text x="113" y="1643.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Commit y recuperación local</text><polyline points="425.0,1500 425.0,1275.0 425.0,1050" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="425.0,1050 431.9594485457797,1064.4071536376428 418.0405514542203,1064.4071536376428" fill="white" stroke="#63768a" stroke-width="2"/><rect x="343.0" y="1220" width="164.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="353.0" y="1240.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contrato</text><rect x="805" y="1500" width="660" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="805" y="1500" width="660" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="823" y="1524.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADOR</text><text x="823" y="1558.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">AlmacenEvidenciasS3</text><text x="823" y="1615.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">SDK S3 / SHA-256</text><text x="823" y="1643.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Objetos y acceso autorizado</text><polyline points="1135.0,1500 1135.0,1275.0 1135.0,1050" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1135.0,1050 1141.9594485457797,1064.4071536376428 1128.0405514542203,1064.4071536376428" fill="white" stroke="#63768a" stroke-width="2"/><rect x="1053.0" y="1220" width="164.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1063.0" y="1240.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contrato</text><rect x="1515" y="1500" width="660" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="1515" y="1500" width="660" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="1533" y="1524.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADOR</text><text x="1533" y="1558.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">GeneradorActasPdf</text><text x="1533" y="1615.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Biblioteca de renderizado</text><text x="1533" y="1643.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Formato PDF institucional</text><polyline points="1845.0,1500 1845.0,1275.0 1845.0,1050" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="1845.0,1050 1851.9594485457797,1064.4071536376428 1838.0405514542203,1064.4071536376428" fill="white" stroke="#63768a" stroke-width="2"/><rect x="1763.0" y="1220" width="164.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="1773.0" y="1240.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contrato</text><rect x="2225" y="1500" width="660" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="2225" y="1500" width="660" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="2243" y="1524.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ADAPTADOR</text><text x="2243" y="1558.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">NotificadorInstitucional</text><text x="2243" y="1615.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Cliente SMS / correo</text><text x="2243" y="1643.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Aceptación y confirmación</text><polyline points="2555.0,1500 2555.0,1275.0 2555.0,1050" fill="none" stroke="#63768a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8"/><polygon points="2555.0,1050 2561.9594485457797,1064.4071536376428 2548.0405514542203,1064.4071536376428" fill="white" stroke="#63768a" stroke-width="2"/><rect x="2473.0" y="1220" width="164.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="2483.0" y="1240.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Realiza contrato</text><rect x="95" y="2090" width="2800" height="265" rx="0" fill="#e7f0f9" stroke="#236da5" stroke-width="2"/><rect x="95" y="2090" width="2800" height="83" rx="0" fill="#236da5" stroke="none" stroke-width="2"/><text x="113" y="2114.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#dcecf9">ENSAMBLAJE · CONOCE AMBOS LADOS</text><text x="113" y="2148.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">InspeccionesModule · raíz de composición</text><text x="113" y="2205.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Registra los adaptadores concretos e inyecta cada implementación bajo el contrato del núcleo.</text><text x="113" y="2233.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">API: conecta controlador y RegistrarInspeccionCasoUso. Worker: conecta consumidor y ProcesarActaCasoUso.</text><text x="113" y="2261.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#18344e">Las pruebas sustituyen adaptadores por dobles que respeten el contrato; no prueban durabilidad real del motor.</text><rect x="95" y="2440" width="2800" height="100" rx="0" fill="#f5f8fb" stroke="#c3d3df" stroke-width="2"/><text x="115" y="2476.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18344e">Regla comprobable</text><text x="115" y="2512.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#53677a">Dominio y aplicación no importan NestJS, ORM, SDK ni clases de infraestructura. Las llamadas del worker a repositorio y almacén se detallan en su secuencia; Notificador pertenece al consumidor de avisos.</text><polyline points="65,2540 2935,2540" fill="none" stroke="#b8c9d8" stroke-width="2" stroke-linejoin="round"/><text x="65" y="2571.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#447a9e">LECTURA DEL DIAGRAMA</text><text x="65" y="2604.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#53677a">Discontinua abierta: dependencia de código · Triángulo hueco: realización · La ejecución usa un objeto concreto detrás del contrato; composición selecciona ese objeto</text><text x="65" y="2665.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#53677a">Diseño propuesto · RF: requisito funcional · T1/T2: transacciones locales · SIFITUR Huamanga</text></svg>