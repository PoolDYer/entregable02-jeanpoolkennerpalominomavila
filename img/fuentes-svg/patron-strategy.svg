nt-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#9b6b23">DATOS</text><text x="92" y="953.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#142d45">Factores de entrada</text><polyline points="92,969 748,969" fill="none" stroke="#dce3ea" stroke-width="1" stroke-linejoin="round"/><text x="92" y="995.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Vigencias · aforo</text><text x="92" y="1021.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142d45">Clausuras previas · denuncias</text><polyline points="420.0,890 420.0,695.0 420.0,500" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><polyline points="426.9594485457797,514.4071536376429 420.0,500 413.0405514542203,514.4071536376429" fill="none" stroke="#657e8e" stroke-width="3" stroke-linejoin="round"/><rect x="341.5" y="675" width="157.0" height="35" rx="4" fill="#ffffff" stroke="none" stroke-width="2"/><text x="351.5" y="695.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142d45">Aporta factores</text><rect x="55" y="1320" width="2290" height="112" rx="12" fill="#eaf1f7" stroke="none" stroke-width="2"/><text x="78" y="1355.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#142d45">Versionado de la decisión</text><text x="78" y="1388.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a">Una evaluación conserva política, fecha, factores y categoría. Las ponderaciones concretas requieren regla institucional; no se sustituyen factores parciales como si fueran políticas equivalentes.</text><polyline points="55,1518 2345,1518" fill="none" stroke="#c8d4df" stroke-width="2" stroke-linejoin="round"/><text x="55" y="1553.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#52687a">Azul: canal / aplicación · Verde: negocio · Violeta: contrato / adaptador · Ámbar: datos · Gris: externo</text><text x="55" y="1